<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#060608" />
    <meta name="description" content="A smile-powered live AR weather experience." />
    <title>Smile Live AR</title>
  </head>
  <body>
    <main id="app" class="app" data-state="idle">
      <video id="camera" class="camera" autoplay muted playsinline></video>
      <canvas id="fx-canvas" class="fx-canvas" aria-hidden="true"></canvas>

      <div class="ambient" aria-hidden="true"></div>
      <div class="flash" id="flash" aria-hidden="true"></div>

      <header class="topbar">
        <a class="brand" href="#" aria-label="Smile Live home">
          <span class="brand-mark" aria-hidden="true"></span>
          <span>SMILE/LIVE</span>
        </a>
        <div class="topbar-actions">
          <div class="live-badge" aria-label="Live experience">
            <span class="live-dot"></span>
            LIVE
          </div>
          <button id="close-button" class="close-camera-button" type="button" aria-label="Close camera" title="Close camera">
            <i data-lucide="camera-off" aria-hidden="true"></i>
          </button>
        </div>
      </header>

      <section class="signal-panel" aria-live="polite">
        <span id="signal-label" class="signal-label">CAMERA OFF</span>
        <div class="smile-meter" aria-hidden="true">
          <span id="smile-fill" class="smile-fill"></span>
        </div>
      </section>

      <section id="start-screen" class="start-screen">
        <div class="intro-lockup" aria-hidden="true">
          <span class="intro-kicker">LIVE AR WEATHER</span>
          <div class="intro-title">
            <span>RAIN.</span>
            <span class="offset-title">SMILE.</span>
            <span class="outline-title">IGNITE.</span>
          </div>
        </div>

        <div class="permission-panel">
          <p class="permission-copy">Your expression controls the sky.</p>
          <button id="start-button" class="start-button" type="button">
            <i data-lucide="camera" aria-hidden="true"></i>
            <span>OPEN CAMERA</span>
          </button>
          <p class="privacy-note">
            <i data-lucide="shield-check" aria-hidden="true"></i>
            Face data stays on this device
          </p>
        </div>
      </section>

      <section id="error-panel" class="error-panel" role="alert" hidden>
        <i data-lucide="camera-off" aria-hidden="true"></i>
        <h1>Camera unavailable</h1>
        <p id="error-message">Check camera access and try again.</p>
        <button id="retry-button" class="secondary-button" type="button">TRY AGAIN</button>
      </section>

      <div id="smile-callout" class="smile-callout" aria-hidden="true">
        <span>EXPRESSION WEATHER</span>
        <strong>READY</strong>
      </div>

      <footer class="controls">
        <button id="sound-button" class="icon-button" type="button" aria-label="Mute sound" data-active="true">
          <i data-lucide="volume-2" aria-hidden="true"></i>
        </button>
        <button id="capture-button" class="capture-button" type="button" aria-label="Take photo">
          <span></span>
        </button>
      </footer>

      <div id="toast" class="toast" role="status" aria-live="polite"></div>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
